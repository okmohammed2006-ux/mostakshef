<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة مستكشف</title><link rel="stylesheet" href="/css/style.css"></head><body class="adminFrame">
<header><div><div class="brand">🧭 مستكشف — لوحة التحكم</div><div class="adminSub" id="adminWelcome">إدارة المحتوى والطلاب</div></div><button onclick="parent.go('home')">↩ العودة للموقع</button></header>
<main><div class="adminLayout"><aside class="adminSide"><button data-tab="dashboard">📊 الرئيسية</button><button data-tab="grades">🎓 الصفوف</button><button data-tab="units">📚 الوحدات</button><button data-tab="lessons">📖 الدروس</button><button data-tab="quizzes">📝 الاختبارات</button><button data-tab="bank">🧠 بنك الأسئلة</button><button data-tab="users" id="usersTab">👥 المستخدمون</button></aside><div class="adminContent"><div id="aToast"></div>
<section data-page="dashboard"><h2>لوحة التحكم</h2><div id="stats" class="stats"></div></section>
<section data-page="grades" class="hidden"><div class="titleRow"><h2>الصفوف</h2><button onclick="openGrade()">+ إضافة صف</button></div><div id="gradesList" class="cards"></div></section>
<section data-page="units" class="hidden"><div class="titleRow"><div><h2>الوحدات</h2><p class="muted">نظّم المنهج داخل كل صف.</p></div><button class="primaryAction" onclick="openUnit()">＋ إضافة وحدة</button></div><div class="toolbar"><input id="unitSearch" placeholder="🔎 ابحث عن وحدة..." oninput="renderUnits()"><select id="unitGradeFilter" onchange="renderUnits()"><option value="">كل الصفوف</option></select></div><div id="unitsList" class="cards"></div></section>
<section data-page="lessons" class="hidden"><div class="titleRow"><div><h2>الدروس</h2><p class="muted">المحتوى التعليمي وفيديوهات يوتيوب المرتبطة.</p></div><button class="primaryAction" onclick="openLesson()">＋ إضافة درس</button></div><div class="toolbar"><input id="lessonSearchAdmin" placeholder="🔎 ابحث عن درس..." oninput="renderLessons()"><select id="lessonGradeFilter" onchange="renderLessons()"><option value="">كل الصفوف</option></select></div><div id="lessonsList" class="cards"></div></section>
<section data-page="quizzes" class="hidden"><div class="titleRow"><div><h2>الاختبارات</h2><p class="muted">اختبارات مؤقتة وتصحيح تلقائي ونسبة نجاح.</p></div><button class="primaryAction" onclick="openQuiz()">＋ إضافة اختبار</button></div><div class="toolbar"><input id="quizSearchAdmin" placeholder="🔎 ابحث عن اختبار..." oninput="renderQuizzes()"><select id="quizGradeFilter" onchange="renderQuizzes()"><option value="">كل الصفوف</option></select></div><div id="quizzesList" class="cards"></div></section>
<section data-page="bank" class="hidden"><div class="titleRow"><div><h2>بنك الأسئلة</h2><p class="muted">كل الأسئلة المضافة للاختبارات في مكان واحد.</p></div></div><div class="toolbar"><input id="bankSearch" placeholder="🔎 ابحث في الأسئلة..." oninput="renderBank()"></div><div id="bankList" class="cards"></div></section><section data-page="users" class="hidden"><div class="titleRow"><h2>المستخدمون</h2><button id="addTeacher" onclick="openTeacher()">+ مدرس جديد</button></div><div id="usersList" class="cards"></div></section>
</div></div></main><div id="modal" class="modal hidden"><div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script src="/js/admin.js"></script></body></html>
